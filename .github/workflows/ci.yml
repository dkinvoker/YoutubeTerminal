# Każdy push i pull request: testy jednostkowe + kontrolna kompilacja Native AOT.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Testy jednostkowe
        run: dotnet test tests/YoutubeTerminal.Tests -c Release --logger "trx;LogFileName=wyniki.trx" --results-directory TestResults

      - name: Wyniki testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyniki-testow
          path: TestResults

      - name: Kompilacja Native AOT (kontrolna, bez wbudowanego yt-dlp)
        shell: pwsh
        run: |
          # Kompilator AOT szuka linkera MSVC przez vswhere.exe
          $env:PATH = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer;$env:PATH"
          dotnet publish src/YoutubeTerminal/YoutubeTerminal.csproj -c Release -r win-x64 -o dist
          Get-Item dist/YoutubeTerminal.exe | Select-Object Name, Length
