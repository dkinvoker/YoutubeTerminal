# Automatyczne wydania:
#  1. Każdy push na main uruchamia release-please. Na podstawie commitów w formacie Conventional Commits
#     (feat:, fix:, perf:, feat!:) otwiera lub aktualizuje „PR wydania” z nową wersją i CHANGELOG.md.
#  2. Po scaleniu tego PR release-please tworzy tag vX.Y.Z i wydanie na GitHubie.
#  3. Wtedy zadanie „build” buduje pojedynczy YoutubeTerminal.exe (Native AOT, z wbudowanym yt-dlp)
#     i dołącza go do wydania razem z sumą SHA-256.
# Ręczne uruchomienie (workflow_dispatch) z podanym tagiem przebudowuje pliki istniejącego wydania.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Istniejący tag wydania do przebudowania (np. v1.2.0)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag || inputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pobierz yt-dlp (oficjalne wydanie, weryfikacja SHA-256)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          $base = 'https://github.com/yt-dlp/yt-dlp/releases/latest/download'
          Invoke-WebRequest "$base/yt-dlp.exe" -OutFile tools/yt-dlp.exe
          Invoke-WebRequest "$base/SHA2-256SUMS" -OutFile SHA2-256SUMS
          $line = Get-Content SHA2-256SUMS | Where-Object { $_ -match '\s\*?yt-dlp\.exe$' } | Select-Object -First 1
          if (-not $line) { throw 'Brak sumy kontrolnej yt-dlp.exe w SHA2-256SUMS' }
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash tools/yt-dlp.exe -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw "Suma SHA-256 yt-dlp.exe nie zgadza się ($actual)" }
          Write-Host "yt-dlp $(& tools/yt-dlp.exe --version) — suma SHA-256 poprawna"

      - name: Testy jednostkowe
        run: dotnet test tests/YoutubeTerminal.Tests -c Release

      - name: Publikacja Native AOT
        shell: pwsh
        run: |
          $env:PATH = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer;$env:PATH"
          $version = $env:TAG.TrimStart('v')
          dotnet publish src/YoutubeTerminal/YoutubeTerminal.csproj -c Release -r win-x64 -o dist "-p:Version=$version"
          Remove-Item dist/*.pdb -ErrorAction SilentlyContinue
          $reported = & dist/YoutubeTerminal.exe --version
          if ($reported -notmatch [regex]::Escape($version)) { throw "Plik zgłasza wersję '$reported', oczekiwano $version" }
          $hash = (Get-FileHash dist/YoutubeTerminal.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  YoutubeTerminal.exe" | Out-File -Encoding ascii dist/YoutubeTerminal.exe.sha256
          Get-Item dist/* | Select-Object Name, Length

      - name: Dołącz pliki do wydania
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" dist/YoutubeTerminal.exe dist/YoutubeTerminal.exe.sha256 --clobber
